name: dj_engine_ios
description: Links the BeatDeck DJ engine and a few iPhone helpers into the app.
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: DjEngineIosPlugin
