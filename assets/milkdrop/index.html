<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{width:100%;height:100%;display:block}#c{position:fixed;left:0;top:0;opacity:0;pointer-events:none}#w{position:fixed;left:0;top:0;width:100%;height:100%}#o,#p{position:absolute;left:0;top:0}#p{pointer-events:none;opacity:0}</style>
</head><body><canvas id="c"></canvas><div id="w"><canvas id="o"></canvas><canvas id="p"></canvas></div>
<script src="butterchurn.min.js"></script>
<script src="butterchurnPresets.min.js"></script>
<script>
(function () {
  function say(m) { try { Md.postMessage(m); } catch (e) {} }
  window.onerror = function () { say('fail'); };
  try {
    var canvas = document.getElementById('c');
    var ratio = Math.min(window.devicePixelRatio || 1, 1.5);
    var W = Math.max(64, Math.round(canvas.clientWidth * ratio));
    var H = Math.max(64, Math.round(canvas.clientHeight * ratio));
    canvas.width = W; canvas.height = H;
    // The picture is drawn at the chosen rate on the hidden canvas, and shown on
    // this one. At a low rate each new frame is faded in over the last, so the
    // motion melts from one picture to the next instead of jumping.
    var out = document.getElementById('o'), octx = out.getContext('2d');
    out.width = W; out.height = H;
    // Your photos: a second layer over the picture, slowly zooming and melting from one to the next.
    var wrap = document.getElementById('w'), pc = document.getElementById('p'), pctx = pc.getContext('2d');
    pc.width = W; pc.height = H;
    var photos = [], pStrength = 0, pSecs = 20, pStart = performance.now(), lastP = 0;
    window.clearPhotos = function () { photos = []; pctx.clearRect(0, 0, W, H); };
    window.addPhoto = function (u) { var im = new Image(); im.onload = function () { photos.push(im); }; im.src = u; };
    window.setPhotos = function (s, secs) { pStrength = Math.max(0, Math.min(1, s)); pSecs = Math.max(4, secs); };
    function cover(im, a, z) {
      var sc = Math.max(W / im.width, H / im.height) * z, dw = im.width * sc, dh = im.height * sc;
      pctx.globalAlpha = a; pctx.drawImage(im, (W - dw) / 2, (H - dh) / 2, dw, dh);
    }
    function drawPhotos(now) {
      if (!photos.length || pStrength <= 0) { if (pc.style.opacity !== '0') { pc.style.opacity = '0'; pctx.clearRect(0, 0, W, H); } return; }
      if (now - lastP < 50) return;
      lastP = now; pc.style.opacity = String(pStrength);
      var el = (now - pStart) / 1000, k = Math.floor(el / pSecs), t = el - k * pSecs, n = photos.length;
      var cur = photos[k % n], nxt = photos[(k + 1) % n], f = Math.min(Math.max(2, fade), pSecs / 2);
      var x = t > pSecs - f ? (t - (pSecs - f)) / f : 0;
      pctx.clearRect(0, 0, W, H);
      cover(cur, 1, 1 + 0.08 * (t / pSecs));
      if (x > 0 && nxt !== cur) cover(nxt, x, 1);
      pctx.globalAlpha = 1;
    }
    function mk() { var c = document.createElement('canvas'); c.width = W; c.height = H; c.x = c.getContext('2d'); return c; }
    var fa = mk(), fb = mk(), haveTwo = false, newFrame = false, blendOn = true, blendStart = 0, interval = 200;
    var AC = window.AudioContext || window.webkitAudioContext;
    var ctx = new AC();
    var bc = window.butterchurn.default || window.butterchurn;
    var viz = bc.createVisualizer(ctx, canvas, { width: W, height: H, pixelRatio: 1, textureRatio: 1 });
    var bp = window.butterchurnPresets.getPresets ? window.butterchurnPresets.getPresets() : window.butterchurnPresets;
    var names = Object.keys(bp);
    var order = names.slice().sort(function () { return Math.random() - 0.5; });
    var idx = -1, lastSwitch = 0, gain = 0.5, autoSecs = 30, held = null;
    // Pace: how fast the pictures move (1 = normal) and how long a change from one picture to the next takes.
    var ts = 1, fade = 2.7, vt = 0;
    // Random: each switch picks a fresh value at every change of picture, between the lowest
    // sensible value and the slider's setting. The change timer can be random too (autoSecs < 0).
    var baseTs = 1, baseFade = 2.7, baseGain = 0.5, autoNow = 30, rS = false, rF = false, rI = false;
    function mb(d) { return fade > d ? fade : d; }
    function rnd(lo, hi) { return hi > lo ? lo + Math.random() * (hi - lo) : hi; }
    function reroll() {
      ts = rS ? rnd(0.1, baseTs) : baseTs;
      fade = rF ? rnd(2, baseFade) : baseFade;
      gain = rI ? rnd(0.15, baseGain) : baseGain;
      // Calm look: gentler motion, longer melts between pictures, less punch.
      if (calmOn) { ts = Math.min(ts, 0.4); fade = Math.max(fade, 8); gain = Math.min(gain, 0.3); }
      autoNow = autoSecs < 0 ? rnd(10, 300) : autoSecs;
    }
    window.setPace = function (s, f) { baseTs = Math.max(0.05, Math.min(1, s)); baseFade = Math.max(1, Math.min(40, f)); reroll(); };
    window.setRandom = function (s, f, i) { rS = !!s; rF = !!f; rI = !!i; reroll(); };
    names.sort();
    window.setGain = function (g) { baseGain = Math.max(0.05, Math.min(1.6, g)); reroll(); };
    var fps = 15, lastDraw = 0;
    window.setFps = function (f) { fps = Math.max(2, Math.min(60, f)); };
    var dimV = 1, calmOn = false;
    function applyFilter() {
      wrap.style.filter = 'brightness(' + dimV + ')' + (calmOn ? ' saturate(0.5) contrast(0.88)' : '');
    }
    window.setDim = function (b) { dimV = Math.max(0.05, Math.min(1, b)); applyFilter(); };
    // Calm look: soft colours and gentle movement instead of full psychedelic.
    window.setCalm = function (c) { calmOn = !!c; applyFilter(); reroll(); };
    // Projector: mirror left-right and/or upside down (for rear or ceiling projection).
    window.setFlip = function (h, v) { wrap.style.transform = 'scale(' + (h ? -1 : 1) + ',' + (v ? -1 : 1) + ')'; };
    // The projector page does not need the cover-art stills.
    window.setBlend = function (b) { blendOn = !!b; };
    var shots = true;
    window.setShots = function (b) { shots = !!b; };
    window.setAuto = function (s) { autoSecs = s; reroll(); lastSwitch = performance.now(); };
    window.loadName = function (n) {
      if (n && bp[n]) { held = n; viz.loadPreset(bp[n], mb(1.5)); lastSwitch = performance.now(); } else { held = null; }
    };
    window.nextPreset = function () { held = null; next(1.5); };
    function next(blend) {
      reroll();
      idx = (idx + 1) % order.length;
      viz.loadPreset(bp[order[idx]], blend === 0 ? 0 : (blend == null ? fade : mb(blend)));
      lastSwitch = performance.now();
    }
    next(0);
    var paused = false;
    // Tap = next visual. Hold = freeze / unfreeze.
    var downAt = 0, holdT = null, held2 = false;
    out.addEventListener('pointerdown', function () {
      downAt = performance.now(); held2 = false;
      holdT = setTimeout(function () { held2 = true; paused = !paused; }, 600);
    });
    out.addEventListener('pointerup', function () {
      clearTimeout(holdT);
      if (!held2) { paused = false; held = null; next(1.0); }
    });
    out.addEventListener('pointercancel', function () { clearTimeout(holdT); });

    // The app sends 14 band levels (0..1). Make a waveform whose spectrum has
    // that shape so the presets react to bass, mids and treble.
    var N = (viz.audio && viz.audio.fftSize) || 1024;
    var nb = 14, levels = new Array(nb).fill(0), sm = new Array(nb).fill(0);
    var bins = [], phase = [];
    for (var k = 0; k < nb; k++) {
      bins.push(Math.exp(Math.log(1.6) + (Math.log(300) - Math.log(1.6)) * k / (nb - 1)));
      phase.push(Math.random() * 6.28);
    }
    window.setLevels = function (a) { for (var i = 0; i < nb && i < a.length; i++) levels[i] = a[i]; };
    var tb = new Uint8Array(N), tl = new Uint8Array(N), tr = new Uint8Array(N);
    var t0 = performance.now(), prev = t0, firstFrame = true;
    // A small still of the picture, sent to the app every few seconds so the
    // phone's home screen / lock screen player can show it as the cover art.
    var snap = document.createElement('canvas'); snap.width = 256; snap.height = 256;
    var sctx = snap.getContext('2d'), lastSnap = 0;
    function shot(now) {
      if (!shots || now - lastSnap < 2500) return;
      lastSnap = now;
      try {
        var side = Math.min(canvas.width, canvas.height);
        sctx.drawImage(canvas, (canvas.width - side) / 2, (canvas.height - side) / 2, side, side, 0, 0, 256, 256);
        say('art:' + snap.toDataURL('image/jpeg', 0.72));
      } catch (e) {}
    }
    function frame(now, fromTimer) {
      var dt = (now - prev) / 1000; prev = now;
      var buf = new Float32Array(N), bufR = new Float32Array(N);
      for (var k = 0; k < nb; k++) {
        sm[k] += (levels[k] - sm[k]) * Math.max(0.04, 0.6 * ts);
        var a = sm[k] * sm[k] * 11 * gain * gain * 2.2;
        if (a < 0.05) continue;
        phase[k] += dt * ts * (2.0 + k);
        for (var j = -1; j <= 1; j++) {
          var f = bins[k] * (1 + j * 0.12);
          var p = phase[k] + j * 1.7;
          for (var i = 0; i < N; i++) {
            var s = a * Math.sin(6.2831853 * f * i / N + p);
            buf[i] += s;
            bufR[i] += s * (0.9 + 0.1 * Math.sin(i * 0.01 + k));
          }
        }
      }
      for (var i = 0; i < N; i++) {
        var v = Math.max(0, Math.min(255, 128 + buf[i]));
        var w = Math.max(0, Math.min(255, 128 + bufR[i]));
        tb[i] = v; tl[i] = v; tr[i] = w;
      }
      vt += dt * ts;
      if (!held && autoNow > 0 && now - lastSwitch > autoNow * 1000) next();
      var due = now - lastDraw >= 1000 / fps - 2;
      if (!paused && due) {
        lastDraw = now; interval = 1000 / fps;
        viz.render({ audioLevels: { timeByteArray: tb, timeByteArrayL: tl, timeByteArrayR: tr }, elapsedTime: vt });
        var sw = fa; fa = fb; fb = sw;
        fb.x.drawImage(canvas, 0, 0);
        if (newFrame) haveTwo = true;
        newFrame = true; blendStart = now; shot(now);
        if (!(blendOn && fps < 30 && haveTwo)) { octx.globalAlpha = 1; octx.drawImage(fb, 0, 0); }
      }
      if (!fromTimer) drawPhotos(now);
      if (!paused && !fromTimer && blendOn && fps < 30 && haveTwo) {
        var al = Math.min(1, (now - blendStart) / interval);
        octx.globalAlpha = 1; octx.drawImage(fa, 0, 0);
        octx.globalAlpha = al; octx.drawImage(fb, 0, 0);
        octx.globalAlpha = 1;
      }
      if (firstFrame) { firstFrame = false; say('ok'); say('names:' + JSON.stringify(names)); }
      if (!fromTimer) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    // With the app in the background the browser stops animation frames: keep
    // drawing once a second so the cover art on the home screen keeps moving.
    setInterval(function () { if (document.hidden) frame(performance.now(), true); }, 1000);
  } catch (e) { say('fail'); }
})();
</script></body></html>
